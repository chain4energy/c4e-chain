syntax = "proto3";

package c4echain.compatibility;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "c4echain/compatibility/params.proto";
import "cosmos/staking/v1beta1/staking.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/chain4energy/c4e-chain/x/compatibility/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/c4e/compatibility/v1beta1/params";
  
  }
  
  // Queries a list of Delegations items.
  rpc StakingV3DelegatorDelegations (QueryStakingV3DelegatorDelegationsRequest) returns (QueryStakingV3DelegatorDelegationsResponse) {
    option (google.api.http).get = "/c4e/compatibility/v1beta1/staking/v3/delegations/{delegator_addr}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryStakingV3DelegatorDelegationsRequest {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  // delegator_addr defines the delegator address to query for.
  string delegator_addr = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryStakingV3DelegatorDelegationsResponse {
  // delegation_responses defines all the delegations' info of a delegator.
  repeated cosmos.staking.v1beta1.DelegationResponse delegation_responses = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];

  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}


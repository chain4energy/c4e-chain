syntax = "proto3";
package c4echain.compatibility;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/chain4energy/c4e-chain/x/compatibility/types";

message C4eVestingV2AccountVestingPools {
  string address = 1; // TODO: rename to owner
  repeated C4eVestingV2VestingPool vesting_pools = 3; 
}

message C4eVestingV2VestingPool {
  string name = 1;
  string vesting_type = 2;
  google.protobuf.Timestamp lock_start = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp lock_end = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  string initially_locked = 5 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = false
  ];
  string withdrawn = 6 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = false
  ];
  string sent = 7 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable) = false
  ];
}
